name: Deploy to GitHub Pages

on:
  # Запуск при пуше в main или dev
  push:
    branches: [ main, dev ]
  # Возможность ручного запуска из вкладки Actions на GitHub
  workflow_dispatch:

# Права доступа для сборки, сохранения ветки gh-pages и развертывания GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Предотвращаем конфликты параллельных деплоев
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Prepare Pages directory and sync with gh-pages branch
        run: |
          mkdir -p ./site-deploy
          cd ./site-deploy
          git init
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout -b gh-pages
          fi
          cd ..

          DIST_DIR="./dist/client"
          if [ ! -d "$DIST_DIR" ]; then
            DIST_DIR="./dist"
          fi

          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "Обновляем тестовую версию в /dev/..."
            rm -rf ./site-deploy/dev
            mkdir -p ./site-deploy/dev
            cp -r "$DIST_DIR"/* ./site-deploy/dev/

            # Если корень ещё пустой, создаём редирект на /dev/
            if [ ! -f "./site-deploy/index.html" ]; then
              echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./dev/"></head><body>Redirecting to <a href="./dev/">dev</a>...</body></html>' > ./site-deploy/index.html
            fi
          else
            echo "Обновляем боевую версию в корне /..."
            if [ -d "./site-deploy/dev" ]; then
              mv ./site-deploy/dev /tmp/dev-backup
            fi
            find ./site-deploy -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            cp -r "$DIST_DIR"/* ./site-deploy/
            if [ -d "/tmp/dev-backup" ]; then
              mv /tmp/dev-backup ./site-deploy/dev
            fi
          fi

          touch ./site-deploy/.nojekyll

          cd ./site-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${{ github.ref_name }} to Pages [skip ci]" || echo "Нет новых изменений для коммита в gh-pages"
          git push origin gh-pages
          cd ..

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

